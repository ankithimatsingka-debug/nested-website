<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested - Funding dreams, one goal at a time</title>
    <meta name="description" content="Mutual fund investing app designed for parents. Goal-based planning, automatic rebalancing, and personalized asset allocation for your child's future." />
    <meta name="author" content="Nested" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="canonical" href="https://nested.money/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Preconnect to external resources - BEFORE preloading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Critical CSS for above-the-fold content - prevents CLS and improves FCP -->
    <style>
      /* Critical font fallback - prevents FOIT */
      body { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        min-height: 100vh;
      }
      h1, h2, h3, h4, h5, h6 { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      /* Critical hero styles to prevent CLS */
      .hero-image-container {
        aspect-ratio: 280 / 560;
        max-width: 280px;
        width: 100%;
      }
      
      /* Prevent layout shift from rotating text */
      .rotating-text-container {
        min-height: 4rem;
      }
      
      /* Header placeholder to prevent CLS */
      .header-placeholder {
        height: 64px;
      }
      
      /* Initial loading state */
      #root:empty::before {
        content: '';
        display: block;
        height: 100vh;
        background: linear-gradient(135deg, hsl(221 83% 53%), hsl(16 84% 65%));
      }
    </style>
    
    <!-- Google Fonts - loaded after initial paint to prevent render blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito+Sans:wght@400;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" /></noscript>
    
    <!-- Defer non-critical JS -->
    <script>
      // Load fonts after first paint
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function() {
          var link = document.querySelector('link[rel="preload"][as="style"]');
          if (link) link.rel = 'stylesheet';
        });
      }
    </script>

    <!-- Open Graph -->
    <meta property="og:title" content="Nested - Funding dreams, one goal at a time" />
    <meta property="og:description" content="Mutual fund investing app designed for parents. Goal-based planning, automatic rebalancing, and personalized asset allocation for your child's future." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nested.money/" />
    <meta property="og:image" content="https://nested.money/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nested_money" />
    <meta name="twitter:image" content="https://nested.money/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
