<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested - Funding dreams, one goal at a time</title>
    <meta name="description" content="Mutual fund investing app designed for parents. Goal-based planning, automatic rebalancing, and personalized asset allocation for your child's future." />
    <meta name="author" content="Nested" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="canonical" href="https://nested.money/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Preconnect to external resources - BEFORE preloading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Critical CSS for above-the-fold content - prevents CLS and improves FCP -->
    <style>
      /* Critical font fallback - prevents FOIT */
      body { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        min-height: 100vh;
      }
      h1, h2, h3, h4, h5, h6 { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      /* Critical hero styles to prevent CLS */
      .hero-image-container {
        aspect-ratio: 280 / 560;
        max-width: 280px;
        width: 100%;
      }
      
      /* Prevent layout shift from rotating text */
      .rotating-text-container {
        min-height: 4rem;
      }
      
      /* Header placeholder to prevent CLS */
      .header-placeholder {
        height: 64px;
      }
      
      /* Initial loading state */
      #root:empty::before {
        content: '';
        display: block;
        height: 100vh;
        background: linear-gradient(135deg, hsl(221 83% 53%), hsl(16 84% 65%));
      }
    </style>
    
    <!-- Google Fonts - non-render-blocking with media swap -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito+Sans:wght@400;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito+Sans:wght@400;600&display=swap" /></noscript>

    <!-- Open Graph -->
    <meta property="og:title" content="Nested - Funding dreams, one goal at a time" />
    <meta property="og:description" content="Mutual fund investing app designed for parents. Goal-based planning, automatic rebalancing, and personalized asset allocation for your child's future." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nested.money/" />
    <meta property="og:image" content="https://nested.money/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nested_money" />
    <meta name="twitter:image" content="https://nested.money/og-image.png" />

    <!-- Facebook Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1227687165357415');
      fbq('track', 'PageView');
    </script>
    <!-- End Facebook Pixel Code -->
  </head>

  <body>
    <!-- Facebook Pixel noscript fallback -->
    <noscript>
      <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=1227687165357415&ev=PageView&noscript=1"/>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
